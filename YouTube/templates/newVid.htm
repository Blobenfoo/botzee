<html>
    <head>
        <title>New Video - OTube</title>
    </head>
    <body>
        <h1>New Video</h1>
        <form method="post" enctype="multipart/form-data">
            <p>Title:</p>
            <input name="Title" required="true" /><br>
            <p>Description:</p>
            <textarea name="Description"></textarea><br>
            <input type="file" name="file" accept="video/webm" /><br>
            <input type="submit" />
        </form>
    </body>
</html>
