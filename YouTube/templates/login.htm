<html>
    <head>
        <title>Log In</title>
    </head>
    <body>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class=flashes>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
        </ul>
  {% endif %}
{% endwith %}
        <form method="post">
            <h1>Log In</h1>
            <p>Channel Name:</p>
            <input name="channelName" required="true" />
            <p>Passowrd: </p>
            <input name="pwd" required="true" type="password" />
            <input type="submit">
        </form>

    </body>
</html>
